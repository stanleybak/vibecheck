[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecheck-nn"
version = "1.1.0"
description = "Vibe-Coded Neural Network Verification Tool"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Stanley Bak" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    # onnx/onnxruntime are PINNED to the VNNCOMP 2026 witness-replay environment
    # (onnx 1.21.0 / onnxruntime 1.26.0 / Python 3.12). The official scorer replays
    # every `sat` witness on exactly these versions; vibecheck validates its own
    # counterexamples on the same engine (see onnxruntime below), so the pin keeps a
    # CE vibecheck accepts from being rejected by a newer ORT's slightly different
    # floats. Bump both together only when the official scorer's pins move.
    "onnx==1.21.0",
    "torch",
    # Gurobi backs the exact-MILP refutation escalation (core/milp.py) that the
    # pipeline reaches for on spread-slack relu nets. The pip wheel ships a
    # size-limited license sufficient for the unit tests and the bundled
    # examples; a full license is only needed for large models.
    "gurobipy",
    # onnxsim constant-folds dynamic-shape subgraphs (Shape/Gather/Concat) and
    # spectral-norm weight divisions into static form before graph construction.
    # Required to load SAGAN-style self-attention generators (cgan
    # small_transformer); see onnx_loader.load_onnx's auto-simplify trigger.
    "onnxsim",
    # Runtime: the universal SAT-witness validation (verify_graph._validate_sat_witness,
    # main._verify chokepoint) replays witnesses on CPU onnxruntime — the VNNCOMP scoring
    # engine — and the surrogate-attack mode uses it for counterexample validation. PINNED
    # to 1.26.0 (the 2026 scorer's exact version): CE-replay numerics are ORT's, so an
    # unpinned install pulling a newer ORT could compute a different witness Y and disagree
    # with the official scorer. CPUExecutionProvider is forced at every call site.
    "onnxruntime==1.26.0",
    # quantized-surrogate attack handler (handlers/quant_surrogate.py): converts the
    # folded float surrogate of an INT8-quantized model to torch for gradient-PGD.
    # onnx2torch handles transformer ops (Softmax/Erf/LayerNorm) that vibecheck's own
    # forward graph does not.
    "onnx2torch",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "onnxruntime==1.26.0"]

[project.scripts]
vibecheck = "vibecheck.pipeline:main"

[project.urls]
Homepage = "https://github.com/stanleybak/vibecheck-nn"
Repository = "https://github.com/stanleybak/vibecheck-nn"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibecheck = ["examples/*"]

[tool.pytest.ini_options]
# Two tiers: `pytest tests/` runs the quick suite (seconds); the thorough
# coverage tier is opt-in via `pytest tests/ -m thorough` (a -m on the
# command line overrides the default below).
addopts = "-m 'not thorough'"
markers = [
    "integration: per-benchmark verdict regression tests (slow; require GPU + vnncomp benchmarks)",
    "thorough: comprehensive coverage tier (minutes, still no benchmark files); run with -m thorough",
]
